
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadiibi AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #172554;
      font-size: 25px;
      font-weight: bold;
    }
    #chat {
      height: 70vh;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { background: #263449; }
    .user {
      background: #2563eb;
      margin-left: auto;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      position: sticky;
      bottom: 0;
      background: #101827;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>🤖 Jadiibi AI</header>

  <div id="chat">
    <div class="message bot">
      Hello! Welcome to Jadiibi AI.
      How can I help you today?
    </div>
  </div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask me anything..."
      autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("userInput");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    
async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  try {
    const response = await fetch(
      "https://jadiibi-ai-backend.rajansaraswati30.workers.dev/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: [
            {
              role: "user",
              content: message
            }
          ]
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

    addMessage(data.reply, "bot");

  } catch (error) {
    addMessage(
      "Sorry, I couldn't connect to Jadiibi AI. Please try again.",
      "bot"
    );
  }
}


input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
