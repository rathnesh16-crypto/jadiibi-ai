
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadiibi AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #172554;
      font-size: 25px;
      font-weight: bold;
    }
    #chat {
      height: 70vh;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { background: #263449; }
    .user {
      background: #2563eb;
      margin-left: auto;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      position: sticky;
      bottom: 0;
      background: #101827;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>🤖 Jadiibi AI</header>

  <div id="chat">
    <div class="message bot">
      Hello! Welcome to Jadiibi AI.
      How can I help you today?
    </div>
  </div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask me anything..."
      autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("userInput");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function getReply(message) {
      const text = message.toLowerCase();

      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! I am Jadiibi AI. How can I help you?";
      }
      if (text.includes("your name")) {
        return "My name is Jadiibi AI!";
      }
      if (text.includes("who created you")) {
        return "I am the Jadiibi AI chatbot project.";
      }
      if (text.includes("help")) {
        return "I can chat with you. A real AI model can be connected next!";
      }
      return "You said: " + message +
        "\nI am a basic chatbot right now. Connect an AI model to get smarter answers!";
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";

      addMessage(getReply(message), "bot");
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
